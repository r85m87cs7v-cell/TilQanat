<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6fbf9">
<meta name="description" content="TILQANAT — қазақ тілін ойын арқылы үйрен: сабақтар, XP ұпайлары, деңгейлер мен тапсырмалар.">
<title>TILQANAT • Қазақ тілін ойын арқылы үйрен</title>
<style>
:root{--ink:#182d2c;--muted:#667a76;--green:#159773;--green2:#0e7c64;--pale:#e8faf2;--sky:#f4f9ff;--blue:#4a8ddf;--purple:#8064e9;--yellow:#ffcb47;--red:#ed6675;--line:#e3ece9;--bg:#f6faf8;--white:#fff;--shadow:0 8px 28px rgba(27,73,58,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;line-height:1.4}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #78c5ad;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}a{color:inherit}
.shell{max-width:1000px;margin:auto;padding:20px 19px 105px}.top{position:sticky;top:0;z-index:20;background:rgba(246,250,248,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.top-inner{max-width:1000px;padding:11px 19px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{display:flex;align-items:center;gap:9px;font-size:1.14rem;font-weight:900;letter-spacing:-.04em}.mark{background:var(--green);width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:white;font-size:1.2rem;transform:rotate(-8deg)}.stats{display:flex;gap:7px;align-items:center}.stat{display:flex;align-items:center;gap:5px;background:white;padding:8px 10px;border:1px solid var(--line);border-radius:15px;font-size:.89rem;font-weight:800;white-space:nowrap}.stat span:first-child{font-size:1.08rem}.stat.xp{color:#c08b05}.stat.lives{color:var(--red)}.stat.fire{color:#d48218}
.hero{background:linear-gradient(125deg,#13866d,#22b893);padding:25px;color:white;border-radius:28px;box-shadow:0 13px 25px rgba(19,134,109,.16);position:relative;overflow:hidden;min-height:176px}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.11)}.hero:before{width:195px;height:195px;right:-55px;top:-79px}.hero:after{width:115px;height:115px;right:60px;bottom:-88px}.hero-inner{position:relative;z-index:1;max-width:650px}.eyebrow{font-size:.83rem;letter-spacing:.05em;font-weight:750;color:#d4ffeb}.hero h1{font-size:clamp(1.7rem,4.7vw,2.45rem);margin:7px 0;line-height:1.14;letter-spacing:-.035em}.hero p{max-width:470px;margin:0;color:#e7fff5}.hero-icon{position:absolute;right:18px;bottom:8px;font-size:4.5rem;transform:rotate(9deg);filter:drop-shadow(0 6px 9px rgba(2,54,41,.2))}
.dashboard{display:grid;grid-template-columns:1fr 250px;gap:18px;margin-top:24px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}.section-title h2{margin:0;font-size:1.33rem;letter-spacing:-.02em}.mini{font-size:.82rem;color:var(--muted)}.unit{background:white;border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:16px;box-shadow:var(--shadow)}.unit-top{display:flex;gap:12px;align-items:center;margin-bottom:17px}.unit-icon{height:49px;width:49px;border-radius:17px;display:grid;place-items:center;font-size:1.5rem;flex-shrink:0}.unit h3{margin:0;font-size:1.08rem}.unit-top p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.lesson-list{display:grid;gap:12px}.lesson{width:100%;text-align:left;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-bottom:4px solid #d8e6e0;border-radius:18px;background:#fbfdfc;padding:13px;transition:transform .16s,border-color .16s}.lesson:not(:disabled):active{transform:scale(.98)}.lesson.open{border-color:#9bdcc4;background:#f1fff7;border-bottom-color:var(--green)}.lesson.done{border-color:#b7d8ff;background:#f5faff;border-bottom-color:var(--blue)}.bubble{width:45px;height:45px;display:grid;place-items:center;border-radius:15px;font-size:1.4rem;background:#e8f3ee;flex-shrink:0}.lesson.open .bubble{background:#d9f8e9}.lesson.done .bubble{background:#e0efff}.lesson .lesson-text{flex:1;min-width:0}.lesson-text b{display:block;font-size:.95rem}.lesson-text small{color:var(--muted);display:block;margin-top:3px}.arrow{font-weight:900;font-size:1.2rem;color:var(--green)}.lesson.done .arrow{color:var(--blue)}.lesson:disabled .arrow{color:#a9b8b2}
.side{display:grid;align-content:start;gap:15px}.sidecard{background:white;border:1px solid var(--line);padding:19px;border-radius:21px;box-shadow:var(--shadow)}.sidecard h3{font-size:1.07rem;margin:0 0 8px}.sidecard p{font-size:.86rem;margin:0;color:var(--muted)}.large{font-size:2rem;font-weight:900;letter-spacing:-.05em;color:var(--green);margin:2px 0 6px}.bar{width:100%;background:#e5eeea;border-radius:99px;height:11px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#21ae80,#48ce9e);border-radius:inherit;transition:width .25s}.how{display:grid;gap:10px}.howline{display:flex;align-items:start;gap:9px;font-size:.85rem}.howline span{background:#e7f7f1;color:var(--green2);font-weight:900;width:25px;height:25px;display:grid;place-items:center;border-radius:9px;flex-shrink:0}.reset{margin-top:15px;color:#88938e;border:none;background:none;font-size:.79rem;text-decoration:underline}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:22;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:9px max(15px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:none;justify-content:space-around;box-shadow:0 -8px 20px #234b3710}.bottom-nav button{border:0;background:none;color:var(--muted);font-size:.76rem;font-weight:750;display:grid;justify-items:center;gap:2px}.bottom-nav .active{color:var(--green)}.bottom-nav b{font-size:1.3rem}
.quiz-screen{max-width:680px;margin:8px auto 40px}.quizbar{display:flex;align-items:center;gap:11px;margin-bottom:21px}.back{border:1px solid var(--line);border-radius:14px;background:#fff;padding:9px 13px;font-size:1rem}.qprogress{flex:1;background:#e7eee9;height:12px;border-radius:99px;overflow:hidden}.qprogress>div{height:100%;background:var(--green);border-radius:99px;transition:width .23s}.questioncard{background:white;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.lesson-label{text-transform:uppercase;letter-spacing:.06em;font-size:.73rem;font-weight:900;color:var(--green)}.questioncard h2{font-size:clamp(1.3rem,4.5vw,1.85rem);line-height:1.25;margin:8px 0 8px;letter-spacing:-.02em}.qhelp{color:var(--muted);margin:0 0 17px;font-size:.92rem}.choices{display:grid;gap:10px;margin-top:20px}.choice,.token,.pairbtn{border:2px solid #e1eae6;border-bottom:4px solid #dce8e2;border-radius:14px;background:#fff;padding:13px 15px;color:var(--ink);font-weight:750;min-height:51px;transition:background .15s}.choice{text-align:left}.choice:active,.token:active,.pairbtn:active{transform:translateY(2px)}.choice.selected,.token.selected,.pairbtn.selected{background:#e6f7ef;border-color:#4cbf91;border-bottom-color:#159773}.choice.good,.pairbtn.matched{background:#e1f8e9;border-color:#28b978;color:#127b51}.choice.bad{background:#ffe9e9;border-color:#ec7484;color:#a72c43}.choice:disabled{opacity:1}.answer-area{min-height:61px;padding:12px;border:2px dashed #c1dbce;border-radius:14px;background:#f9fdfb;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tokenarea{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.token{padding:10px 12px;min-height:42px}.token:disabled{opacity:.35}.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.paircol{display:grid;gap:9px}.pairbtn{font-size:.91rem;min-height:58px;padding:11px 7px}.pairbtn.matched{opacity:.55}.feedback{margin-top:20px;background:#f6faf8;border-radius:16px;padding:12px 14px;font-weight:800}.feedback.ok{background:#e5fbef;color:#127646}.feedback.no{background:#ffeded;color:#a73e52}.foot-actions{display:flex;justify-content:space-between;align-items:center;gap:13px;margin-top:20px}.primary{color:white;background:var(--green);border:0;border-bottom:4px solid var(--green2);border-radius:15px;font-weight:900;padding:13px 21px;min-height:49px;flex:1}.primary:active{transform:translateY(2px);border-bottom-width:2px}.secondary{background:white;color:var(--green2);border:2px solid #b4d9cb;border-radius:14px;padding:11px 15px;font-weight:800}.voice{display:inline-flex;align-items:center;gap:6px;background:#effaf6;border:1px solid #a4dac7;color:#187b5d;padding:10px 13px;border-radius:13px;font-weight:800}.qmeta{display:flex;align-items:center;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:9px}.congrats{padding:34px 24px;text-align:center;background:white;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);margin-top:20px}.trophy{font-size:5rem;margin:9px 0 12px}.congrats h2{font-size:1.85rem;margin:0 0 10px}.congrats p{color:var(--muted)}.rewards{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:17px 0 23px}.reward{padding:11px 14px;background:#fff8dc;border-radius:13px;font-weight:900;color:#986e13}.reward:nth-child(2){color:#d74460;background:#ffedf2}.tiny{font-size:.79rem;color:var(--muted)}
@media(min-width:850px){.lesson-list{grid-template-columns:1fr 1fr}}@media(max-width:700px){.dashboard{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.hero-icon{opacity:.5}.shell{padding:18px 14px 104px}}@media(max-width:480px){.logo{font-size:1rem}.mark{width:29px;height:29px;border-radius:10px}.stats{gap:3px}.stat{font-size:.76rem;padding:7px}.stat span:first-child{font-size:.9rem}.hero{padding:22px}.side{grid-template-columns:1fr}.sidecard{padding:17px}.bottom-nav{display:flex}.questioncard{padding:19px}.shell{padding:16px 12px 115px}.unit{padding:14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner"><div class="logo"><span class="mark">Қ</span> TILQANAT</div><div class="stats"><div class="stat fire" title="Күнделікті қатарынан оқу"><span>🔥</span><span id="streak">0</span></div><div class="stat xp" title="Тәжірибе ұпайы"><span>⭐</span><span id="xp">0</span></div><div class="stat lives" title="Жүрек"><span>❤️</span><span id="hearts">5</span></div></div></div></header>
<div id="app" aria-live="polite"></div>
<nav class="bottom-nav" aria-label="Төменгі мәзір"><button class="active" data-action="home"><b>🏠</b>Сабақтар</button><button data-action="progress"><b>🏆</b>Жетістік</button><button data-action="tips"><b>📖</b>Нұсқау</button></nav>
<script>
"use strict";
/* Сайттың сабақтарын өзгерту үшін дәл осы LESSONS бөлігін өңдеуге болады. */
const LESSONS=[
 {id:"greet",unit:0,icon:"👋",title:"Амандасу",desc:"Алғашқы амандасу сөздері",target:"Сәлем",meaning:"Привет",distractors:["Рақмет","Кітап","Жоқ"],meanings:["Спасибо","Да","До свидания"],phrase:["Қайырлы","таң"],phraseRu:"Доброе утро",pairs:[["Сәлем","Привет"],["Рақмет","Спасибо"],["Сау бол","Пока"]]},
 {id:"polite",unit:0,icon:"💚",title:"Сыпайы сөздер",desc:"Рақмет, өтінемін, кешіріңіз",target:"Өтінемін",meaning:"Пожалуйста",distractors:["Дос","Сары","Кеше"],meanings:["Спасибо","Добрый вечер","Нет"],phrase:["Көп","рақмет"],phraseRu:"Большое спасибо",pairs:[["Өтінемін","Пожалуйста"],["Кешіріңіз","Извините"],["Рақмет","Спасибо"]]},
 {id:"meet",unit:0,icon:"🙂",title:"Танысу",desc:"Өзіңді таныстыр",target:"Атым",meaning:"Моё имя",distractors:["Үйім","Бүгін","Анам"],meanings:["Мой дом","Сегодня","Мама"],phrase:["Менің","атым","Айша"],phraseRu:"Меня зовут Айша",pairs:[["Мен","Я"],["Сен","Ты"],["Атым","Моё имя"]]},
 {id:"family",unit:1,icon:"👨‍👩‍👧",title:"Отбасы",desc:"Жақындарыңды ата",target:"Ана",meaning:"Мама",distractors:["Көк","Дәптер","Су"],meanings:["Папа","Сестра","Брат"],phrase:["Бұл","менің","анам"],phraseRu:"Это моя мама",pairs:[["Әке","Папа"],["Ана","Мама"],["Бала","Ребёнок"]]},
 {id:"colors",unit:1,icon:"🎨",title:"Түстер",desc:"Түстерді қазақша айт",target:"Қызыл",meaning:"Красный",distractors:["Жасыл","Көк","Ақ"],meanings:["Синий","Белый","Жёлтый"],phrase:["Бұл","қызыл","алма"],phraseRu:"Это красное яблоко",pairs:[["Қызыл","Красный"],["Жасыл","Зелёный"],["Қара","Чёрный"]]},
 {id:"numbers",unit:1,icon:"🔢",title:"Сандар",desc:"Бірден онға дейін",target:"Үш",meaning:"Три",distractors:["Бір","Бес","Он"],meanings:["Один","Пять","Десять"],phrase:["Менде","екі","кітап","бар"],phraseRu:"У меня есть две книги",pairs:[["Бір","Один"],["Екі","Два"],["Үш","Три"]]},
 {id:"home",unit:2,icon:"🏡",title:"Менің үйім",desc:"Үйдегі заттардың атауы",target:"Терезе",meaning:"Окно",distractors:["Көше","Бала","Сабақ"],meanings:["Дверь","Стол","Стул"],phrase:["Бұл","менің","үйім"],phraseRu:"Это мой дом",pairs:[["Есік","Дверь"],["Терезе","Окно"],["Үстел","Стол"]]},
 {id:"food",unit:2,icon:"🍎",title:"Тамақ",desc:"Жейтін және ішетін нәрселер",target:"Су",meaning:"Вода",distractors:["Кітап","Үлкен","Есік"],meanings:["Хлеб","Молоко","Чай"],phrase:["Мен","су","ішемін"],phraseRu:"Я пью воду",pairs:[["Су","Вода"],["Нан","Хлеб"],["Сүт","Молоко"]]},
 {id:"daily",unit:2,icon:"🗣️",title:"Күнделікті сөйлем",desc:"Қарапайым сөйлем құра",target:"Оқимын",meaning:"Я читаю / учусь",distractors:["Барамын","Көремін","Ішемін"],meanings:["Я иду","Я вижу","Я пью"],phrase:["Мен","қазақ","тілін","үйренемін"],phraseRu:"Я учу казахский язык",pairs:[["Оқимын","Я читаю"],["Жазамын","Я пишу"],["Келемін","Я прихожу"]]}
];
const UNITS=[{title:"1-бөлім · Алғашқы қадам",subtitle:"Сәлемдесу және танысу",icon:"🌱",bg:"#def8eb"},{title:"2-бөлім · Айналамдағы әлем",subtitle:"Отбасы, түстер, сандар",icon:"🌈",bg:"#e6efff"},{title:"3-бөлім · Сөйлем құрайық",subtitle:"Үй, тамақ, күнделікті тіршілік",icon:"🚀",bg:"#f0e9ff"}];
const KEY="tilqanat-progress-v1";
const defaults=()=>({xp:0,hearts:5,completed:[],streak:0,lastDay:""});
function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&typeof o==="object")return {...defaults(),...o,completed:Array.isArray(o.completed)?o.completed.filter(id=>LESSONS.some(l=>l.id===id)):[]}}catch(e){}return defaults()}
let state=load(),quiz=null,view="home";
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function today(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return today(d)}
function stats(){document.getElementById('xp').textContent=state.xp;document.getElementById('hearts').textContent=state.hearts;document.getElementById('streak').textContent=state.streak}
function unlocked(i){return i===0||state.completed.includes(LESSONS[i-1].id)}
function render(){stats();document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.action===view));document.getElementById('app').innerHTML=quiz?renderQuiz():view==='progress'?renderProgress():view==='tips'?renderTips():renderHome()}
function renderHome(){const n=state.completed.length;return `<main class="shell"><div class="hero"><div class="hero-inner"><span class="eyebrow">✨ ҚАЗАҚ ТІЛІ • ОЙЫНМЕН ҮЙРЕН</span><h1>Күн сайын бір қадам алға!</h1><p>Сабақ оқы, дұрыс жауап бер, жұлдыз жина. Барлығы өз қолыңда!</p></div><span class="hero-icon" aria-hidden="true">🦊</span></div><div class="dashboard"><div><div class="section-title"><h2>🗺️ Сабақтар картасы</h2><span class="mini">${n} / ${LESSONS.length} сабақ</span></div>${UNITS.map((u,idx)=>`<section class="unit"><div class="unit-top"><div class="unit-icon" style="background:${u.bg}">${u.icon}</div><div><h3>${u.title}</h3><p>${u.subtitle}</p></div></div><div class="lesson-list">${LESSONS.map((l,i)=>({...l,i})).filter(l=>l.unit===idx).map(l=>{const done=state.completed.includes(l.id),open=unlocked(l.i);return `<button type="button" class="lesson ${done?'done':open?'open':''}" data-action="lesson" data-index="${l.i}" ${open?'':'disabled'}><span class="bubble">${open?l.icon:'🔒'}</span><span class="lesson-text"><b>${esc(l.title)}</b><small>${done?'✅ Аяқталды':open?esc(l.desc):'Алдыңғы сабақты аяқта'}</small></span><span class="arrow">${done?'★':open?'➜':'·'}</span></button>`}).join('')}</div></section>`).join('')}</div><aside class="side"><div class="sidecard"><h3>🏆 Жетістігің</h3><div class="large">${Math.round(n/LESSONS.length*100)}%</div><div class="bar"><div style="width:${n/LESSONS.length*100}%"></div></div><p style="margin-top:9px">${n} сабақ аяқталды · ${state.xp} XP</p></div><div class="sidecard"><h3>💡 Қалай ойнаймыз?</h3><div class="how"><div class="howline"><span>1</span><div>Ашық сабақты таңда.</div></div><div class="howline"><span>2</span><div>4 тапсырманы орында.</div></div><div class="howline"><span>3</span><div>Ұпай жинап, келесі деңгейді аш!</div></div></div></div></aside></div></main>`}
function renderProgress(){let n=state.completed.length;return `<main class="shell"><div class="hero"><div class="hero-inner"><span class="eyebrow">🏆 МЕНІҢ ЖЕТІСТІГІМ</span><h1>Әр қадам маңызды!</h1><p>Жинаған XP ұпайларың мен сабақтағы нәтижелерің.</p></div><span class="hero-icon">⭐</span></div><div class="dashboard"><div class="unit"><h2 style="margin-top:0">Жетістік көрсеткіштері</h2><div class="grid-progress" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="sidecard" style="box-shadow:none;background:#fff9e4"><div class="large">${state.xp}</div><p>⭐ Барлық XP</p></div><div class="sidecard" style="box-shadow:none;background:#fff0ed"><div class="large">${state.streak}</div><p>🔥 Оқу күндері</p></div><div class="sidecard" style="box-shadow:none;background:#e9f9f2"><div class="large">${n}</div><p>✅ Өткен сабақ</p></div><div class="sidecard" style="box-shadow:none;background:#edf3ff"><div class="large">${state.hearts}</div><p>❤️ Қалған жүрек</p></div></div><h3>Жалпы прогресс</h3><div class="bar"><div style="width:${n/LESSONS.length*100}%"></div></div><p class="tiny">${n} / ${LESSONS.length} сабақ</p><div class="foot-actions"><button class="primary" data-action="home">Сабақтарға оралу →</button></div></div></div></main>`}
function renderTips(){return `<main class="shell"><div class="unit"><h2>📖 Сайтты қолдану</h2><p>Бұл — телефонға ыңғайлы қазақ тілі тренажері. Мұнда алғашқы 9 сабақ бар.</p><div class="how" style="margin-top:17px"><div class="howline"><span>1</span><div>Сабақтар картасынан жасыл түсті сабақты аш.</div></div><div class="howline"><span>2</span><div>Сөзді таңда, сөйлемді құрастыр, екі тілдегі сөздерді сәйкестендір.</div></div><div class="howline"><span>3</span><div>Дұрыс жауап үшін +10 XP аласың. Қате жауап бір жүректі азайтады.</div></div><div class="howline"><span>4</span><div>Сабақты бірінші рет аяқтасаң, +20 XP сыйлық және келесі сабақ ашылады.</div></div><div class="howline"><span>5</span><div>Жүрек таусылса, тегін қайта толтырып, сабақты басынан бастауға болады.</div></div></div><p style="margin-top:17px">🔊 Дыбыстау iPhone-да қазақ тіліндегі дауыс орнатылған болса ғана дұрыс жұмыс істеуі мүмкін.</p><p class="tiny">Прогресс осы браузерде сақталады; басқа телефонға автоматты түрде көшпейді.</p><button class="reset" data-action="reset">Барлық нәтижені өшіру</button><div class="foot-actions"><button class="primary" data-action="home">Сабақтарға өту →</button></div></div></main>`}
function startLesson(i){if(!Number.isInteger(i)||i<0||i>=LESSONS.length||!unlocked(i))return;quiz={i,step:0,placed:[],selSide:null,selIndex:null,matched:[],lock:false,correct:0,feedback:"",status:""};view="quiz";render();window.scrollTo({top:0,behavior:'smooth'})}
function question(){const l=LESSONS[quiz.i];return quiz.step===0?{type:'choice',title:`«${l.meaning}» қазақша қалай айтылады?`,hint:'Дұрыс қазақша сөзді таңда.',options:[l.target,...l.distractors].sort((a,b)=>a.localeCompare(b,'kk')),answer:l.target}:quiz.step===1?{type:'choice',title:`«${l.target}» сөзінің мағынасы қандай?`,hint:'Орысша аудармасын таңда.',options:[l.meaning,...l.meanings].sort((a,b)=>a.localeCompare(b,'ru')),answer:l.meaning}:quiz.step===2?{type:'order',title:'Сөйлемді дұрыс құрастыр',hint:`Орысша: «${l.phraseRu}»`,tokens:l.phrase}: {type:'match',title:'Сөздер мен аудармаларды сәйкестендір',hint:'Сол жақтағы қазақша сөз бен оң жақтағы орысша сөзді жұпта.',pairs:l.pairs}}
function displayChoice(q){return `<div class="choices">${q.options.map((opt,i)=>{let cl='choice';if(quiz.lock&&opt===q.answer)cl+=' good';if(quiz.lock&&quiz.selected===opt&&opt!==q.answer)cl+=' bad';return `<button class="${cl}" ${quiz.lock?'disabled':''} data-action="choose" data-index="${i}">${esc(opt)}</button>`}).join('')}</div>`}
function displayOrder(q){const selected=quiz.placed.map(i=>`<button class="token selected" data-action="unplace" data-index="${i}" ${quiz.lock?'disabled':''}>${esc(q.tokens[i])} ×</button>`).join('');return `<div class="answer-area">${selected||'<span class="mini">Сөздерді төменнен таңда...</span>'}</div><div class="tokenarea">${q.tokens.map((word,i)=>`<button class="token" data-action="place" data-index="${i}" ${quiz.lock||quiz.placed.includes(i)?'disabled':''}>${esc(word)}</button>`).join('')}</div>`}
function displayMatch(q){const rightOrder=[2,0,1];return `<div class="pairgrid"><div class="paircol">${q.pairs.map((p,i)=>`<button class="pairbtn ${quiz.matched.includes(i)?'matched':quiz.selSide==='left'&&quiz.selIndex===i?'selected':''}" data-action="pair" data-side="left" data-index="${i}" ${quiz.lock||quiz.matched.includes(i)?'disabled':''}>${esc(p[0])}</button>`).join('')}</div><div class="paircol">${rightOrder.map(i=>`<button class="pairbtn ${quiz.matched.includes(i)?'matched':quiz.selSide==='right'&&quiz.selIndex===i?'selected':''}" data-action="pair" data-side="right" data-index="${i}" ${quiz.lock||quiz.matched.includes(i)?'disabled':''}>${esc(q.pairs[i][1])}</button>`).join('')}</div></div>`}
function renderQuiz(){const l=LESSONS[quiz.i];if(quiz.done)return renderFinish();if(state.hearts<=0)return `<main class="shell quiz-screen"><div class="congrats"><div class="trophy">💔</div><h2>Жүректер бітіп қалды</h2><p>Уайымдама! Жүректерді тегін толтырып, сабақты қайта бастай аласың.</p><button class="primary" data-action="refill">❤️ 5 жүрекпен қайта бастау</button><div class="foot-actions"><button class="secondary" data-action="leave">Сабақтарға оралу</button></div></div></main>`;const q=question();return `<main class="shell quiz-screen"><div class="quizbar"><button class="back" data-action="leave" aria-label="Сабақтан шығу">✕</button><div class="qprogress"><div style="width:${(quiz.step/4)*100}%"></div></div><span class="stat lives">❤️ ${state.hearts}</span></div><div class="qmeta"><span>${esc(l.title)}</span><strong>${quiz.step+1} / 4</strong></div><div class="questioncard"><span class="lesson-label">${q.type==='choice'?'🧠 СӨЗДІК':q.type==='order'?'🧩 СӨЙЛЕМ ҚҰРАУ':'🔗 СӘЙКЕСТЕНДІРУ'}</span><h2>${esc(q.title)}</h2><p class="qhelp">${esc(q.hint)}</p>${q.type==='order'?`<button class="voice" data-action="speak" data-word="${esc(q.tokens.join(' '))}">🔊 Сөйлемді тыңдау</button>`:q.type==='choice'?`<button class="voice" data-action="speak" data-word="${esc(l.target)}">🔊 ${esc(l.target)} сөзін тыңдау</button>`:''}${q.type==='choice'?displayChoice(q):q.type==='order'?displayOrder(q):displayMatch(q)}${quiz.feedback?`<div class="feedback ${quiz.status==='ok'?'ok':'no'}" role="status">${esc(quiz.feedback)}</div>`:''}<div class="foot-actions">${!quiz.lock&&q.type==='order'?`<button class="secondary" data-action="clear">Тазалау</button><button class="primary" data-action="check" ${quiz.placed.length!==q.tokens.length?'disabled':''}>Тексеру</button>`:quiz.lock?`<button class="primary" data-action="next">${quiz.step===3?'Сабақты аяқтау 🎉':'Жалғастыру →'}</button>`:q.type==='match'?'<span class="tiny">3 жұпты тауып шық ✨</span>':'<span class="tiny">Дұрыс жауапты бас 👆</span>'}</div></div></main>`}
function grade(ok,correctText){if(quiz.lock)return;quiz.lock=true;quiz.status=ok?'ok':'no';quiz.feedback=ok?'✅ Дұрыс! +10 XP':`❌ Бұл жолы қате. Дұрыс жауап: ${correctText}`;if(ok){state.xp+=10;quiz.correct++}else state.hearts=Math.max(0,state.hearts-1);save();render()}
function onPair(side,i){if(quiz.lock||quiz.matched.includes(i))return;if(!quiz.selSide||quiz.selSide===side){quiz.selSide=side;quiz.selIndex=i;render();return}const same=quiz.selIndex===i;if(same){quiz.matched.push(i);quiz.feedback=`✅ ${quiz.matched.length} / 3 жұп табылды!`;quiz.status='ok';quiz.selSide=null;quiz.selIndex=null;if(quiz.matched.length===3){grade(true,'')}else render()}else{state.hearts=Math.max(0,state.hearts-1);save();quiz.feedback='❌ Жұп сәйкес келмеді, қайта көр.';quiz.status='no';quiz.selSide=null;quiz.selIndex=null;render()}}
function finish(){const id=LESSONS[quiz.i].id;const fresh=!state.completed.includes(id);if(fresh){state.completed.push(id);state.xp+=20}state.hearts=Math.min(5,state.hearts+1);const t=today();if(state.lastDay!==t){state.streak=state.lastDay===yesterday()?state.streak+1:1;state.lastDay=t}quiz.done={fresh,correct:quiz.correct};save();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderFinish(){const d=quiz.done;return `<main class="shell quiz-screen"><div class="congrats"><div class="trophy">🏆</div><h2>Керемет жұмыс!</h2><p><b>${esc(LESSONS[quiz.i].title)}</b> сабағын аяқтадың. Жарайсың!</p><div class="rewards"><div class="reward">⭐ ${d.correct*10+(d.fresh?20:0)} XP</div><div class="reward">❤️ +1 жүрек</div><div class="reward">✅ ${d.correct}/4 дұрыс</div></div><button class="primary" data-action="leave">Сабақтар картасына қайту →</button></div></main>`}
function speak(word){if(!('speechSynthesis' in window)){alert('Дыбыстау бұл браузерде қолжетімсіз.');return}try{window.speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(word);msg.lang='kk-KZ';msg.rate=.8;window.speechSynthesis.speak(msg)}catch(e){alert('Дыбыстау сәтсіз аяқталды.')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,i=Number(b.dataset.index);if(a==='home'||a==='progress'||a==='tips'){quiz=null;view=a;render();window.scrollTo({top:0,behavior:'smooth'});return}if(a==='lesson'){startLesson(i);return}if(a==='leave'){quiz=null;view='home';render();return}if(a==='speak'){speak(b.dataset.word);return}if(a==='reset'){if(confirm('Барлық XP, сабақ және нәтиже өшірілсін бе?')){state=defaults();quiz=null;view='home';save();render()}return}if(a==='refill'){state.hearts=5;save();startLesson(quiz.i);return}if(!quiz||quiz.done)return;if(a==='choose'){if(!quiz.lock){const q=question();const option=q.options[i];quiz.selected=option;grade(option===q.answer,q.answer)}return}if(a==='place'){if(!quiz.lock&&!quiz.placed.includes(i)){quiz.placed.push(i);render()}return}if(a==='unplace'){if(!quiz.lock){quiz.placed=quiz.placed.filter(v=>v!==i);render()}return}if(a==='clear'){quiz.placed=[];render();return}if(a==='check'){const q=question();if(!quiz.lock&&quiz.placed.length===q.tokens.length){const arr=quiz.placed.map(x=>q.tokens[x]);const correct=arr.every((w,j)=>w===q.tokens[j]);grade(correct,q.tokens.join(' '))}return}if(a==='pair'){onPair(b.dataset.side,i);return}if(a==='next'&&quiz.lock){if(quiz.step===3){finish();return}quiz.step++;quiz.placed=[];quiz.selSide=null;quiz.selIndex=null;quiz.matched=[];quiz.lock=false;quiz.feedback='';quiz.status='';quiz.selected=undefined;render();window.scrollTo({top:0,behavior:'smooth'})}});
render();
</script>
</body>
</html>
